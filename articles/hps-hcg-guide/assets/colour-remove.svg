<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>白を一括削除：枠の内側にも透明が広がる</title><defs><pattern id="check" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="#fff"/><path d="M0 0h16v16H0ZM16 16h16v16H16Z" fill="#d3d8d0"/></pattern></defs><rect width="1200" height="675" fill="#fffbea"/><g font-family="system-ui,sans-serif"><rect x="16" y="16" width="1168" height="643" fill="#fffbea" stroke="#123b2d" stroke-width="5"/><text x="46" y="70" font-size="34" fill="#123b2d" font-weight="700">白を一括削除：枠の内側にも透明が広がる</text><rect x="46" y="111" width="465" height="421" fill="#ffffff" stroke="#123b2d" stroke-width="4"/><text x="76" y="157" font-size="30" fill="#123b2d" font-weight="700">BEFORE：白背景</text><g transform="translate(151 194) scale(2.5)" shape-rendering="crispEdges"><rect x="2" y="2" width="96" height="96" fill="#ffffff" stroke="#123b2d" stroke-width="4"/><path d="M24 20H38V44H62V20H76V74H62V58H38V74H24Z" fill="#123b2d"/><rect x="24" y="82" width="52" height="8" fill="#ffd400" stroke="none" stroke-width="0"/></g><path d="M564 280h36v-16h12v8h12v8h12v16h-12v8h-12v8h-12v-16h-36Z" fill="#ffd400" stroke="#123b2d" stroke-width="3"/><rect x="691" y="111" width="465" height="421" fill="url(#check)" stroke="#123b2d" stroke-width="4"/><text x="721" y="157" font-size="30" fill="#123b2d" font-weight="700">AFTER：透過PNG</text><g transform="translate(796 194) scale(2.5)" shape-rendering="crispEdges"><rect x="2" y="2" width="96" height="96" fill="none" stroke="#123b2d" stroke-width="4"/><path d="M24 20H38V44H62V20H76V74H62V58H38V74H24Z" fill="#123b2d"/><rect x="24" y="82" width="52" height="8" fill="#ffd400" stroke="none" stroke-width="0"/></g><text x="46" y="582" font-size="30" fill="#123b2d" font-weight="700">白をタップ → 外側と枠の内側をまとめて削除</text><text x="46" y="630" font-size="27" fill="#123b2d" font-weight="700">Hと枠線は残る例。残したい白も同時に消えるので確認を。</text></g></svg>