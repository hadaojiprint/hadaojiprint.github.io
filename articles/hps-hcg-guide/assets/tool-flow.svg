<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>HCG → PNG保存 → HPS：同じHロゴで確認</title><defs><pattern id="check" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="#fff"/><path d="M0 0h16v16H0ZM16 16h16v16H16Z" fill="#d3d8d0"/></pattern></defs><rect width="1200" height="675" fill="#fffbea"/><g font-family="system-ui,sans-serif"><rect x="16" y="16" width="1168" height="643" fill="#fffbea" stroke="#123b2d" stroke-width="5"/><text x="46" y="70" font-size="34" fill="#123b2d" font-weight="700">HCG → PNG保存 → HPS：同じHロゴで確認</text><rect x="46" y="108" width="458" height="456" fill="#e8f1e8" stroke="#123b2d" stroke-width="4"/><text x="78" y="157" font-size="30" fill="#123b2d" font-weight="700">1. HCG：データを整える</text><rect x="116" y="182" width="300" height="250" fill="url(#check)" stroke="#123b2d" stroke-width="4"/><g transform="translate(186 218) scale(1.8)" shape-rendering="crispEdges"><rect x="2" y="2" width="96" height="96" fill="none" stroke="#123b2d" stroke-width="4"/><path d="M24 20H38V44H62V20H76V74H62V58H38V74H24Z" fill="#123b2d"/><rect x="24" y="82" width="52" height="8" fill="#ffd400" stroke="none" stroke-width="0"/></g><text x="78" y="482" font-size="29" fill="#123b2d" font-weight="700">背景除去・実寸・PPI</text><text x="78" y="529" font-size="29" fill="#123b2d" font-weight="700">透過PNGを保存</text><path d="M560 280h36v-16h12v8h12v8h12v16h-12v8h-12v8h-12v-16h-36Z" fill="#ffd400" stroke="#123b2d" stroke-width="3"/><rect x="696" y="108" width="458" height="456" fill="#e8f1e8" stroke="#123b2d" stroke-width="4"/><text x="724" y="157" font-size="30" fill="#123b2d" font-weight="700">2. HPS：配置を試す</text><g transform="translate(827 178)"><path d="M60 0H92V12H108V0H140V12H164V24H188V36H212V72H196V92H164V72H156V248H44V72H36V92H4V72H-12V36H12V24H36V12H60Z" fill="#fffbea" stroke="#123b2d" stroke-width="6"/><path d="M72 12v12h56V12" fill="none" stroke="#123b2d" stroke-width="5"/><g transform="translate(59.0 70) scale(0.82)" shape-rendering="crispEdges"><rect x="2" y="2" width="96" height="96" fill="none" stroke="#123b2d" stroke-width="4"/><path d="M24 20H38V44H62V20H76V74H62V58H38V74H24Z" fill="#123b2d"/><rect x="24" y="82" width="52" height="8" fill="#ffd400" stroke="none" stroke-width="0"/></g></g><text x="724" y="482" font-size="27" fill="#123b2d" font-weight="700">PNGを「画像を追加」で読む</text><text x="724" y="529" font-size="27" fill="#123b2d" font-weight="700">ウェアの色・位置・幅を調整</text><text x="46" y="620" font-size="29" fill="#123b2d" font-weight="700">画像の保存と読み込みは手動です。自動転送ではありません。</text></g></svg>