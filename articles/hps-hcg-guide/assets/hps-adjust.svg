<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>HPSは前面・背面を切り替えて位置を調整</title><rect width="1200" height="675" fill="#fffbea"/><g font-family="system-ui,sans-serif"><rect x="16" y="16" width="1168" height="643" fill="#fffbea" stroke="#123b2d" stroke-width="6"/><text x="48" y="75" font-size="32" font-weight="700" fill="#123b2d">HPSは前面・背面を切り替えて位置を調整</text><rect x="48" y="120" width="1104" height="433" fill="#705036" stroke="#123b2d" stroke-width="6"/><rect x="75" y="143" width="1050" height="325" fill="#fffbea" stroke="#123b2d" stroke-width="6"/><text x="110" y="190" font-size="26" font-weight="700" fill="#123b2d">前面</text><text x="654" y="190" font-size="26" font-weight="700" fill="#123b2d">背面</text><g transform="translate(224 226)"><path d="M48 0H80V12H112V0H144V12H168V24H192V48H180V72H156V60H144V180H48V60H36V72H12V48H0V24H24V12H48Z" fill="#fffbea" stroke="#123b2d" stroke-width="8" stroke-linejoin="miter"/><rect x="74" y="65" width="48" height="48" fill="#ffd400"/><path d="M82 76V104H91V94H105V104H114V76H105V85H91V76Z" fill="#123b2d"/></g><g transform="translate(766 226)"><path d="M48 0H80V12H112V0H144V12H168V24H192V48H180V72H156V60H144V180H48V60H36V72H12V48H0V24H24V12H48Z" fill="#fffbea" stroke="#123b2d" stroke-width="8" stroke-linejoin="miter"/><rect x="74" y="65" width="48" height="48" fill="#ffd400"/><path d="M82 76V104H91V94H105V104H114V76H105V85H91V76Z" fill="#123b2d"/></g><rect x="124" y="488" width="240" height="45" fill="#ffd400" stroke="#123b2d" stroke-width="6"/><text x="140" y="519" font-size="22" font-weight="700" fill="#123b2d">横幅を調整</text><rect x="478" y="488" width="240" height="45" fill="#ffd400" stroke="#123b2d" stroke-width="6"/><text x="494" y="519" font-size="22" font-weight="700" fill="#123b2d">ドラッグで移動</text><rect x="832" y="488" width="240" height="45" fill="#ffd400" stroke="#123b2d" stroke-width="6"/><text x="848" y="519" font-size="22" font-weight="700" fill="#123b2d">回転を調整</text><text x="50" y="603" font-size="28" font-weight="700" fill="#123b2d">画像追加・文字追加・カラー変更にも対応。</text><text x="50" y="645" font-size="25" font-weight="700" fill="#123b2d">保存用画像は、左に前面・右に背面が並びます。</text></g></svg>