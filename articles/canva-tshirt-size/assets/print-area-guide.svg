  <rect x="18" y="18" width="1164" height="639" fill="#123b2c" stroke="#f4c533" stroke-width="12"/>
  <rect x="36" y="36" width="1128" height="603" fill="url(#grid)" stroke="#071a14" stroke-width="8"/>
  <rect x="88" y="58" width="1024" height="66" fill="#071a14" stroke="#f4c533" stroke-width="6"/>
