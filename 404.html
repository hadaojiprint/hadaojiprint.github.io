<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ページを移動しています｜ウェアプリントLAB</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#102c22;color:#fff;font-family:"Courier New","Yu Gothic",monospace;text-align:center}
    main{border:4px solid #fff;box-shadow:8px 8px #000;padding:34px 24px;max-width:520px;margin:20px}
    h1{color:#ffd400;font-size:24px}p{line-height:1.8}a{display:inline-block;margin-top:14px;background:#ffd400;color:#111;padding:14px 18px;text-decoration:none;font-weight:900}
  </style>
  <script>
    (() => {
      const oldBase = '/wearprint-lab';
      if (location.pathname === oldBase || location.pathname.startsWith(oldBase + '/')) {
        const nextPath = location.pathname.slice(oldBase.length) || '/';
        location.replace(location.origin + nextPath + location.search + location.hash);
      }
    })();
  </script>
</head>
<body><main><p>WORLD MOVE</p><h1>新しい島へ移動します</h1><p>ウェアプリントLABは新しいURLへ移動しました。</p><a href="/">トップページへ ▶</a></main></body>
</html>
