name: Weekly Search Console Report

on:
  workflow_dispatch:
  schedule:
    # Monday 07:30 JST = Sunday 22:30 UTC
    - cron: '30 22 * * 0'

permissions:
  contents: read
  id-token: write

jobs:
  gsc-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/222561776881/locations/global/workloadIdentityPools/hadaoji-gsc/providers/github-actions
          service_account: hadaoji-gsc@project-d717ade0-c6e3-4065-b04.iam.gserviceaccount.com

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth

      - name: Fetch Search Console data
        env:
          GSC_SITE_URL: https://hadaojiprint.github.io/
        run: python scripts/gsc_fetch.py

      - name: Upload SEO report
        uses: actions/upload-artifact@v4
        with:
          name: gsc-report-${{ github.run_number }}
          path: gsc-report/
          retention-days: 30
