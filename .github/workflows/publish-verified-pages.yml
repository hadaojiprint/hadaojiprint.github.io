name: Publish verified static website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify canonical LP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import hashlib
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
          path = Path("platform/index.html")
          html = path.read_text()
          check = Check()
          check.feed(html)
          assert "first-shirt-price" in check.ids, "First-order price section missing"
          assert len(check.ids) == len(set(check.ids)), "Duplicate section IDs"
          assert 'content="noindex' not in html, "Canonical LP must remain indexable"
          assert 'first-shirt-price' in Path("platform/style.css").read_text(), "LP styles missing"
          print("Verified LP SHA256:", hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Confirm the public LP matches this deployment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, time, urllib.request
          expected = hashlib.sha256(Path("platform/index.html").read_bytes()).hexdigest()
          url = "https://hadaojiprint.github.io/platform/"
          for attempt in range(3):
              request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read()
                  actual = hashlib.sha256(body).hexdigest()
                  print("HTTP", response.status, "Last-Modified", response.headers.get("Last-Modified"), "SHA256", actual, flush=True)
              if actual == expected:
                  print("Public LP matches the verified deployment.")
                  break
              if attempt < 2:
                  time.sleep(30)
          else:
              raise SystemExit("Publication mismatch: deployment succeeded, but the public LP is stale. Expected " + expected)
          PY
