name: Cache Bust Adventure JS

on:
  push:
    paths:
      - '.github/workflows/cache-bust-adventure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust scroll adventure cache
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for p in Path('.').rglob('*.html'):
              text = p.read_text(encoding='utf-8')
              new = text.replace('scroll-adventure.js?v=20260828c', 'scroll-adventure.js?v=20260830a')
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))
          print('updated', len(changed), 'files')
          for p in changed:
              print(p)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          git commit -m "Bust adventure JS cache for clear tracking"
          git push
