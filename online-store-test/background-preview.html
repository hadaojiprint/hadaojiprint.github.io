<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>HADAOJI 背景合成テスト</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#f7f3df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:12px}h1{font-size:22px;color:#ffd84a}.stage{position:relative;aspect-ratio:9/16;max-height:72vh;background:#222;border:4px solid #ffd84a;overflow:hidden}.stage canvas{width:100%;height:100%;display:block;object-fit:cover}video{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,a{border:0;border-radius:4px;padding:13px 15px;font-weight:800;text-decoration:none}.on{background:#ffd84a;color:#111}.off{background:#333;color:#fff;border:1px solid #666}.status{padding:10px;background:#1c1c1c;border:1px solid #555;line-height:1.5;font-size:13px}.hint{font-size:12px;color:#bbb;line-height:1.6}</style></head><body><main class="wrap"><h1>8BIT店舗背景・人物切り抜き TEST</h1><div class="stage"><canvas id="out" width="360" height="640"></canvas><video id="cam" autoplay muted playsinline></video></div><div class="actions"><button id="start" class="on">カメラ＋人物認識を開始</button><button id="raw" class="off">通常カメラ</button><a class="off" href="./">通話テストへ戻る</a></div><div class="status" id="status">「開始」を押してください。最初の読み込みは数秒かかる場合があります。</div><p class="hint">このページでは通話を行わず、iPhone上で「人物だけを残して店舗背景へ差し替えられるか」を確認します。映像は端末内で処理します。</p></main><script type="module">import{ImageSegmenter,FilesetResolver}from'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm';const v=document.querySelector('#cam'),c=document.querySelector('#out'),x=c.getContext('2d'),s=document.querySelector('#status');let seg=null,stream=null,running=false,last=-1;function bg(){let g=x.createLinearGradient(0,0,0,c.height);g.addColorStop(0,'#171717');g.addColorStop(.22,'#34271f');g.addColorStop(1,'#201914');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);x.fillStyle='#080808';x.strokeStyle='#ffd84a';x.lineWidth=4;x.fillRect(35,25,290,62);x.strokeRect(35,25,290,62);x.fillStyle='#ffd84a';x.font='bold 22px monospace';x.textAlign='center';x.fillText('HADAOJI PRINT',180,63);x.fillStyle='#eee9d8';for(const q of[35,275]){x.fillRect(q,125,50,85)}x.fillStyle='#765637';x.fillRect(0,500,360,140);x.fillStyle='#4d3525';x.fillRect(0,515,360,125);x.fillStyle='#ffd84a';x.font='bold 17px monospace';x.fillText('ONLINE T-SHIRT SHOP',180,575)}function drawRaw(){x.save();x.scale(-1,1);x.drawImage(v,-c.width,0,c.width,c.height);x.restore()}async function init(){s.textContent='人物認識モデルを読み込み中…';const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm');seg=await ImageSegmenter.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter_landscape/float16/latest/selfie_segmenter_landscape.tflite',delegate:'GPU'},runningMode:'VIDEO',outputCategoryMask:true,outputConfidenceMasks:false});s.textContent='モデル準備OK。カメラを起動します…'}async function start(){try{if(!seg)await init();if(!stream)stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:960}},audio:false});v.srcObject=stream;await v.play();running=true;s.textContent='人物を認識中… 黄色い店舗背景に切り替われば成功です。';requestAnimationFrame(loop)}catch(e){s.textContent='開始できませんでした: '+(e?.message||e)}}function loop(){if(!running)return;if(v.readyState>=2&&v.currentTime!==last){last=v.currentTime;try{seg.segmentForVideo(v,performance.now(),res=>{const mask=res.categoryMask;if(!mask){drawRaw();return}const mw=mask.width,mh=mask.height,data=mask.getAsUint8Array();const tmp=document.createElement('canvas');tmp.width=mw;tmp.height=mh;const tx=tmp.getContext('2d');const im=tx.createImageData(mw,mh);for(let i=0;i<data.length;i++){const a=data[i]===0?255:0;im.data[i*4]=255;im.data[i*4+1]=255;im.data[i*4+2]=255;im.data[i*4+3]=a}tx.putImageData(im,0,0);bg();const person=document.createElement('canvas');person.width=c.width;person.height=c.height;const px=person.getContext('2d');px.save();px.scale(-1,1);px.drawImage(v,-c.width,0,c.width,c.height);px.restore();px.globalCompositeOperation='destination-in';px.imageSmoothingEnabled=true;px.drawImage(tmp,0,0,c.width,c.height);x.drawImage(person,0,0);mask.close()})}catch(e){s.textContent='人物認識エラー: '+(e?.message||e);drawRaw()}}requestAnimationFrame(loop)}document.querySelector('#start').onclick=start;document.querySelector('#raw').onclick=()=>{running=false;if(v.readyState>=2)drawRaw();s.textContent='通常カメラ表示です。人物認識を再開するには「開始」を押してください。'};bg();</script></body></html>
